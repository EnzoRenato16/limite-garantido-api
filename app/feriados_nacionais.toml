# Feriados nacionais que não são dia útil bancário, 2026 e 2027.
#
# Vale para os prazos em dias úteis: regulatórios (portabilidade da Res. CVM 210,
# informações da Res. Conjunta 12), operacionais dos trilhos e baixa do gravame. O atraso
# do cartão e do empréstimo continua em dias corridos.
#
# Cada data foi conferida, uma a uma, no calendário de feriados nacionais da ANBIMA
# (urls abaixo), com o dia da semana publicado lá. Os feriados por lei foram conferidos
# também no texto da lei, no Planalto. Carnaval, Paixão de Cristo e Corpus Christi não
# constam das leis de feriado nacional conferidas; entram porque não são dia útil
# bancário pelo calendário da ANBIMA (prática de mercado).
#
# Fora de 2026 e 2027 o calendário levanta ForaDaCobertura: estender exige nova consulta.

cobertura_inicio = 2026-01-01
cobertura_fim = 2027-12-31

[fonte]
nome = "ANBIMA — Feriados nacionais"
urls = [
    "https://www.anbima.com.br/feriados/fer_nacionais/2026.asp",
    "https://www.anbima.com.br/feriados/fer_nacionais/2027.asp",
]
consultado_em = 2026-11-22
leis_conferidas = [
    "Lei 662/1949, art. 1º, na redação da Lei 10.607/2002 — https://www.planalto.gov.br/ccivil_03/leis/l0662.htm",
    "Lei 6.802/1980, art. 1º — https://www.planalto.gov.br/ccivil_03/leis/l6802.htm",
    "Lei 14.759/2023, art. 1º — https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2023/lei/l14759.htm",
]

