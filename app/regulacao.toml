artigo = "art. 2º, §1º"

[[ativos.fii.afirmacoes]]
tema = "o_que_funciona"
texto = "Dentro de casa: gravame na Central Depositária da B3 via custodiante. De fora: portar para a CTVM do grupo e travar."
categoria = "pratica_de_mercado"

[[ativos.fii.afirmacoes]]
tema = "trilho"
texto = "Portabilidade em 2 dias úteis, pedida no custodiante de destino."
categoria = "norma"
