artigo = "arts. 35 e 36"

[[ativos.fii.afirmacoes]]
tema = "produto"
texto = "Só empréstimo, com desconto de 50% a 70% sobre o valor."
categoria = "interpretacao"

[[ativos.fii.afirmacoes]]
