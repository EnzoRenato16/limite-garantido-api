# ------------------------------------------------------------------ fundo DI
[ativos.fundo_di]
nome = "fundo DI da DTVM do grupo"
infraestrutura = "registradora_ou_b3_escriturador"
instrumentos = ["cessao_fiduciaria", "alienacao_fiduciaria"]
trilhos = ["casa", "portabilidade_cvm_210"]
