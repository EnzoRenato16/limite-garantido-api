texto = "A entidade operadora resgata o valor bloqueado em nome do cliente e paga à instituição financeira líquido de tributos e carregamento; os 10% retidos são ilustrativos, somando IR e carregamento."
categoria = "interpretacao"
norma = "Res. Conjunta 12/2024"
artigo = "art. 13"

[[ativos.previdencia.retencao.afirmacoes]]
tema = "retencao"
texto = "A base do IR de PGBL e VGBL não foi reconferida: PGBL sobre o valor total e VGBL sobre o rendimento, pela prática de mercado."
categoria = "nao_verificado"

[[ativos.previdencia.afirmacoes]]
tema = "o_que_funciona"
texto = "De fora, trilho obrigatório e sem recusa: a entidade operadora não pode recusar pedido que siga as normas."
categoria = "norma"
norma = "Res. Conjunta 12/2024"
artigo = "art. 18"

[[ativos.previdencia.afirmacoes]]
tema = "o_que_funciona"
texto = "Vale para PGBL e VGBL de contribuição variável e para capitalização tradicional; o FAPI fica fora."
categoria = "norma"
norma = "Res. Conjunta 12/2024"
artigo = "art. 1º, §1º"

[[ativos.previdencia.afirmacoes]]
tema = "trilho"
texto = "Direito de resgate em garantia de crédito de instituição financeira, por plataforma de infraestrutura autorizada."
categoria = "norma"
norma = "Res. Conjunta 12/2024"
artigo = "arts. 1º, §2º, VII, e 10"

[[ativos.previdencia.afirmacoes]]
tema = "instrumento"
texto = "Após 90 dias de atraso, a instituição financeira pede o resgate; a entidade operadora resgata o valor bloqueado e paga líquido de tributos e carregamento."
categoria = "norma"
norma = "Res. Conjunta 12/2024"
artigo = "arts. 12 e 13"

[[ativos.previdencia.afirmacoes]]
tema = "infraestrutura"
texto = "Plataforma de infraestrutura autorizada para a troca de informações."
categoria = "norma"
norma = "Res. Conjunta 12/2024"
artigo = "art. 10"

[[ativos.previdencia.afirmacoes]]
tema = "infraestrutura"
texto = "Uma plataforma privada opera a troca de informações."
categoria = "imprensa"

[[ativos.previdencia.afirmacoes]]
