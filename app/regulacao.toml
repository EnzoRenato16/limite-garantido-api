[ativos.fundo_di.carteira_de_provisao]
cessao_fiduciaria = "c3"
alienacao_fiduciaria = "c2"

[ativos.fundo_di.retencao]
regra = "tabela_regressiva_renda_fixa"

[[ativos.fundo_di.retencao.afirmacoes]]
tema = "retencao"
texto = "Fundo de renda fixa: IR regressivo sobre o rendimento, de 22,5% a 15% conforme o prazo, retido por quem paga o rendimento."
categoria = "norma"
norma = "Lei 11.033/2004"
artigo = "art. 1º"

[[ativos.fundo_di.afirmacoes]]
tema = "o_que_funciona"
texto = "Cotas de fundos DI da DTVM do grupo, com bloqueio de resgate e gravame sobre as cotas. De fora, portar (mesma classe e subclasse) e travar na casa."
categoria = "pratica_de_mercado"

[[ativos.fundo_di.afirmacoes]]
tema = "trilho"
texto = "Portabilidade de cotas de fundos, pedida no custodiante de destino; a troca de classe ou subclasse fica fora."
categoria = "norma"
norma = "Res. CVM 210/2024"
artigo = "art. 1º, parágrafo único, e art. 8º"

[[ativos.fundo_di.afirmacoes]]
tema = "instrumento"
texto = "Alienação ou cessão fiduciária de cotas: no atraso, o credor vende sem leilão nem ordem judicial, abate a dívida e devolve o saldo com demonstrativo."
categoria = "norma"
norma = "Lei 4.728/1965"
artigo = "art. 66-B, §§3º e 4º"

[[ativos.fundo_di.afirmacoes]]
tema = "infraestrutura"
texto = "Registradoras podem constituir gravames, inclusive sobre cotas."
categoria = "norma"
norma = "Res. CVM 31/2021"
artigo = "art. 36-A"

[[ativos.fundo_di.afirmacoes]]
tema = "infraestrutura"
texto = "Na B3, o bloqueio de cotas exige comando do escriturador, salvo distribuição por conta e ordem."
categoria = "norma"
norma = "Manual de Normas B3 (31/08/2026)"
artigo = "art. 99, §2º"

[[ativos.fundo_di.afirmacoes]]
tema = "produto"
texto = "Cartão só com fundo DI de liquidez imediata (resgate em D+0 ou D+1); empréstimo nos demais casos."
categoria = "pratica_de_mercado"

[[ativos.fundo_di.afirmacoes]]
tema = "prazo"
texto = "Até 9 dias úteis para portar, em etapas de 2, 2 e 3 dias."
categoria = "norma"
norma = "Res. CVM 210/2024"
artigo = "art. 16"

[[ativos.fundo_di.afirmacoes]]
tema = "risco_de_execucao"
texto = "Baixo em fundo DI com resgate em D+0 ou D+1; alto com cotização longa."
categoria = "pratica_de_mercado"

[[ativos.fundo_di.afirmacoes]]
tema = "provisao"
texto = "Alienação fiduciária vai para a C2."
categoria = "interpretacao"
norma = "Res. BCB 352/2023"
artigo = "art. 81, II, \"b\""

[[ativos.fundo_di.afirmacoes]]
tema = "provisao"
texto = "Cessão fiduciária vai para a C3. A carteira do crédito garantido por ativo que não é depósito ainda não tem confirmação oficial."
categoria = "nao_verificado"
norma = "Res. BCB 352/2023"
artigo = "art. 81, III, \"b\""

[[ativos.fundo_di.afirmacoes]]
tema = "ltv"
texto = "LTV de partida de 85% a 95%: hipótese de calibração. A Circular 3.809 aceita cotas se a carteira do fundo for ao menos 95% elegível."
categoria = "interpretacao"
norma = "Circular BCB 3.809/2016"

