texto = "De fora, igual ao CDB de outro banco: transferência de custódia antes do gravame, fora da Res. CVM 210."
categoria = "pratica_de_mercado"

[[ativos.lca.afirmacoes]]
tema = "instrumento"
texto = "Cessão fiduciária: no atraso, o credor vende sem leilão nem ordem judicial, abate a dívida e devolve o saldo com demonstrativo."
categoria = "norma"
norma = "Lei 4.728/1965"
artigo = "art. 66-B, §§3º e 4º"

[[ativos.lca.afirmacoes]]
tema = "infraestrutura"
texto = "A LCA é ativo financeiro registrado em registradora (B3, Balcão): a registradora registra o gravame; o custodiante comanda."
categoria = "norma"
norma = "Res. CMN 4.593/2017"
artigo = "art. 2º"

[[ativos.lca.afirmacoes]]
tema = "produto"
texto = "Só empréstimo, com vencimento casado: a última parcela vence até o vencimento do título."
categoria = "interpretacao"

[[ativos.lca.afirmacoes]]
tema = "prazo"
texto = "Igual ao CDB: gravame no dia na casa; transferência de custódia sem prazo legal encontrado."
categoria = "pratica_de_mercado"

[[ativos.lca.afirmacoes]]
tema = "risco_de_execucao"
texto = "Alto antes da carência: o emissor não pode recomprar nem resgatar antes do prazo mínimo de 6 meses, ou 12 se atualizada por índice de preços. O artigo não foi conferido."
categoria = "nao_verificado"
norma = "Res. CMN 5.006/2022 (alterada pela Res. CMN 5.215/2025)"

[[ativos.lca.afirmacoes]]
tema = "provisao"
texto = "Cessão fiduciária e penhor de direitos creditórios vão para a C3. A carteira do crédito garantido por ativo que não é depósito ainda não tem confirmação oficial."
categoria = "nao_verificado"
norma = "Res. BCB 352/2023"
artigo = "art. 81, III, \"b\""

[[ativos.lca.afirmacoes]]
tema = "ltv"
texto = "LTV de partida de 80% a 90%, só no empréstimo com vencimento casado: hipótese de calibração."
categoria = "interpretacao"

