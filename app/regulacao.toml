# Catálogo regulatório: fonte única do que cada ativo aceita.
#
# Fonte: o documento "Limite Garantido as a Service — checagem regulatória", auditado em
# 20/11/2026 e revisado em 22/11/2026 (fora do repositório). Nada aqui é integração: o
# projeto SIMULA o registro na B3, no Selic e na plataforma da Res. Conjunta 12.
#
# Toda afirmação tem uma categoria:
#   norma               — com `norma` e `artigo` (o carregador recusa sem os dois);
#   pratica_de_mercado  — o que o mercado faz ou divulga;
#   interpretacao       — leitura do documento, a validar com jurídico ou contabilidade;
#   imprensa            — só noticiado;
#   nao_verificado      — a fonte lista como ainda sem confirmação oficial.
# `tema` diz em que coluna da matriz (página /regulacao, docs/regulacao.md) ela aparece.
#
# Unidades: prazos de trilho e de baixa em dias úteis {dia_util}; atraso e tabela
# regressiva em dias corridos {dia_corrido}; LTV, alíquota e piso como razão {1} em texto
# decimal; dinheiro em reais {BRL} como texto.

# Não há confirmação pública de que a CTVM do grupo seja agente de custódia do Tesouro
# Direto. Enquanto for false, Tesouro não entra no cartão.
ctvm_do_grupo_e_agente_do_td = false

# {dia_util} para pedir a baixa do gravame depois da quitação, da liberação ou da execução.
prazo_da_baixa_dias_uteis = 2

# {BRL} por titular e conglomerado (Regulamento do FGC, art. 2º, §2º).
teto_do_fgc = "250000.00"

rota_do_emprestimo = "POST /v1/contas/{conta_id}/emprestimos"
rota_da_matriz = "GET /v1/regulacao/matriz"

[fonte]
documento = "Limite Garantido as a Service — checagem regulatória"
auditado_em = "2026-11-20"
revisado_em = "2026-11-22"

[[afirmacoes]]
tema = "geral"
texto = "Após a quitação, a baixa do gravame deve ser pedida em até 2 dias úteis. A regra é da previdência; o documento recomenda adotá-la para todos os ativos, sem citar o artigo."
categoria = "nao_verificado"

[[afirmacoes]]
tema = "geral"
texto = "O FGC garante até R$ 250 mil por titular e conglomerado."
categoria = "norma"
norma = "Regulamento do FGC (Res. CMN 4.222/2013)"
artigo = "art. 2º, §2º"

[[afirmacoes]]
tema = "geral"
texto = "O beneficiário da garantia do FGC é o titular do crédito, não o credor da operação garantida."
categoria = "norma"
norma = "Regulamento do FGC (Res. CMN 4.222/2013)"
artigo = "art. 2º, §4º, I"

[[afirmacoes]]
tema = "geral"
texto = "Pisos de provisão para inadimplidos, contados a partir do inadimplemento (atraso acima de 90 dias): no 1º mês, C2 30%, C3 45% e C5 50%; no 13º mês, C2 70,8%, C3 89,4% e C5 90,8%."
categoria = "norma"
norma = "Res. CMN 4.966/2021 e Res. BCB 352/2023"
artigo = "art. 81 e Anexo I"

[[afirmacoes]]
tema = "geral"
texto = "Com mais de uma garantia, vale a carteira de menor provisão."
categoria = "norma"
norma = "Res. BCB 352/2023"
artigo = "art. 81, §1º"

[[afirmacoes]]
tema = "geral"
texto = "Crédito sem garantia, como o rotativo, vai para a C5."
categoria = "norma"
norma = "Res. BCB 352/2023"
artigo = "art. 81, V, \"a\""

# Pisos de provisão {1} sobre o saldo, a partir do inadimplemento.
[pisos_de_provisao.c2]
primeiro_mes = "0.30"
decimo_terceiro_mes = "0.708"

[pisos_de_provisao.c3]
primeiro_mes = "0.45"
decimo_terceiro_mes = "0.894"

[pisos_de_provisao.c5]
primeiro_mes = "0.50"
decimo_terceiro_mes = "0.908"

# IR regressivo da renda fixa sobre o rendimento (Lei 11.033/2004, art. 1º). Prazo em
# {dia_corrido} desde a aplicação; a faixa sem `ate_dias_corridos` é "acima de 720".
[[tabela_regressiva_renda_fixa]]
ate_dias_corridos = 180
aliquota = "0.225"

[[tabela_regressiva_renda_fixa]]
ate_dias_corridos = 360
aliquota = "0.20"

[[tabela_regressiva_renda_fixa]]
ate_dias_corridos = 720
aliquota = "0.175"

[[tabela_regressiva_renda_fixa]]
aliquota = "0.15"

# =================================================================== trilhos
# prazo_dias_uteis {dia_util}: ausente quando não há prazo ou quando muda com o ativo
# (aí vem em prazos_por_ativo).

[trilhos.casa]
nome = "custódia na casa"
rota = "POST /v1/contas/{conta_id}/garantias"
prazo_e_regulatorio = false
pode_recusar = false

[[trilhos.casa.afirmacoes]]
tema = "trilho"
texto = "Ativo custodiado na CTVM do grupo, ou cotas de fundo DI da DTVM do grupo, com gravame registrado na B3 ou no Selic a favor da SCD do grupo, no mesmo dia."
categoria = "pratica_de_mercado"

[[trilhos.casa.afirmacoes]]
tema = "trilho"
texto = "O gravame sobre ativo registrado ou depositado só tem eficácia perante terceiros se constituído na registradora ou no depositário central; contrato sozinho não basta."
categoria = "norma"
norma = "Lei 12.810/2013 (redação da Lei 13.476/2017)"
artigo = "art. 26"

[[trilhos.casa.afirmacoes]]
tema = "trilho"
texto = "O limite só é liberado depois da confirmação do registro do gravame."
categoria = "interpretacao"

[trilhos.portabilidade_cvm_210]
nome = "portabilidade (Res. CVM 210)"
rota = "POST /v1/contas/{conta_id}/portabilidades"
prazo_e_regulatorio = true
# Só por impedimento; o art. 19, §1º traz exemplos, não uma lista fechada.
pode_recusar = true

[trilhos.portabilidade_cvm_210.prazos_por_ativo]
acoes = 2
fii = 2
etf = 2
fundo_di = 9

[[trilhos.portabilidade_cvm_210.afirmacoes]]
tema = "prazo"
texto = "Portabilidade em 2 dias úteis para valores mobiliários em depósito centralizado (ações, FIIs, ETFs) e em até 9 dias úteis para cotas de fundos."
categoria = "norma"
norma = "Res. CVM 210/2024"
artigo = "art. 16"

[[trilhos.portabilidade_cvm_210.afirmacoes]]
tema = "trilho"
texto = "A portabilidade pode ser pedida no custodiante de destino."
categoria = "norma"
norma = "Res. CVM 210/2024"
artigo = "art. 8º"

[[trilhos.portabilidade_cvm_210.afirmacoes]]
tema = "trilho"
texto = "Ativo dado em garantia é impedimento à portabilidade; o art. 19, §1º traz exemplos de impedimento, não uma lista fechada."
categoria = "norma"
norma = "Res. CVM 210/2024"
artigo = "art. 19, §1º, IV, \"b\""

[[trilhos.portabilidade_cvm_210.afirmacoes]]
tema = "trilho"
texto = "Pelo entendimento corrente, CDB, LCI, LCA e Tesouro ficam fora da Res. CVM 210, porque não são valores mobiliários."
categoria = "interpretacao"
norma = "Lei 6.385/1976"
artigo = "art. 2º, §1º"

[[trilhos.portabilidade_cvm_210.afirmacoes]]
tema = "trilho"
texto = "Sem resgate nem alienação, a portabilidade não gera fato gerador de IR; isso não vem da CVM."
categoria = "interpretacao"

[trilhos.transferencia_de_custodia]
nome = "transferência de custódia (fora da CVM 210)"
rota = "POST /v1/contas/{conta_id}/transferencias-de-custodia"
# Operacional, ilustrativo e configurável: não encontramos prazo regulatório.
prazo_dias_uteis = 5
prazo_e_regulatorio = false
pode_recusar = true

[[trilhos.transferencia_de_custodia.afirmacoes]]
tema = "trilho"
texto = "CDB, LCI e LCA de outro banco vêm para a CTVM do grupo por pedido de transferência de custódia; não encontramos prazo regulatório para ela."
categoria = "pratica_de_mercado"

[[trilhos.transferencia_de_custodia.afirmacoes]]
tema = "prazo"
texto = "Prazo de 5 dias úteis: operacional, ilustrativo e configurável, não regulatório."
categoria = "pratica_de_mercado"

[[trilhos.transferencia_de_custodia.afirmacoes]]
tema = "trilho"
texto = "O CDB é título nominativo, transferível por endosso ou por lançamento no sistema."
categoria = "norma"
norma = "Lei 13.986/2020"
artigo = "arts. 34 e 35"

[[trilhos.transferencia_de_custodia.afirmacoes]]
tema = "trilho"
texto = "O CDB do próprio emissor, emitido e custodiado por ele, costuma não ser portável."
categoria = "pratica_de_mercado"

[[trilhos.transferencia_de_custodia.afirmacoes]]
tema = "trilho"
texto = "Transferir a custódia sem trocar o titular não é alienação, liquidação, resgate, cessão nem repactuação: não há retenção de IR na transferência."
categoria = "interpretacao"

[trilhos.td_garantia]
nome = "TD Garantia (Selic)"
rota = "POST /v1/contas/{conta_id}/garantias/tesouro"
# O regulamento não fixa prazo; a B3 define. Operacional, ilustrativo e configurável.
prazo_dias_uteis = 3
prazo_e_regulatorio = false
pode_recusar = true

[[trilhos.td_garantia.afirmacoes]]
tema = "trilho"
texto = "O gravame é instruído pelo agente de custódia do investidor nos sistemas da B3 e registrado no Selic."
categoria = "norma"
norma = "Portaria MF 1.748/2024 (Regulamento do TD)"
artigo = "itens 108 e 109"

[[trilhos.td_garantia.afirmacoes]]
tema = "trilho"
texto = "Quando os agentes de custódia do garantidor e do garantido são diferentes, a contraparte confirma."
categoria = "norma"
norma = "Portaria MF 1.748/2024 (Regulamento do TD)"
artigo = "itens 100 e 105"

[[trilhos.td_garantia.afirmacoes]]
tema = "trilho"
texto = "A recusa acontece quando o agente de custódia do cliente não opera o serviço ou não confirma."
categoria = "interpretacao"

[[trilhos.td_garantia.afirmacoes]]
tema = "prazo"
texto = "O regulamento não fixa prazo para o gravame; a B3 define. Os 3 dias úteis são operacionais, ilustrativos e configuráveis."
categoria = "pratica_de_mercado"

[[trilhos.td_garantia.afirmacoes]]
tema = "trilho"
texto = "Execução: o agente do garantido instrui, os títulos são vendidos ao Tesouro e o dinheiro vai ao agente do garantido."
categoria = "norma"
norma = "Portaria MF 1.748/2024 (Regulamento do TD)"
artigo = "itens 116 a 119"

[[trilhos.td_garantia.afirmacoes]]
tema = "trilho"
texto = "Juros e amortizações dos títulos gravados vão ao agente de custódia do garantido."
categoria = "norma"
norma = "Portaria MF 1.748/2024 (Regulamento do TD)"
artigo = "item 127"

[trilhos.res_conjunta_12]
nome = "direito de resgate (Res. Conjunta 12)"
rota = "POST /v1/contas/{conta_id}/garantias/previdencia"
prazo_dias_uteis = 2
prazo_e_regulatorio = true
pode_recusar = false

[[trilhos.res_conjunta_12.afirmacoes]]
tema = "prazo"
texto = "A entidade operadora presta as informações em até 2 dias úteis."
categoria = "norma"
norma = "Res. Conjunta 12/2024"
artigo = "art. 4º, §1º"

[[trilhos.res_conjunta_12.afirmacoes]]
tema = "trilho"
texto = "A entidade operadora não pode recusar pedido que siga as normas."
categoria = "norma"
norma = "Res. Conjunta 12/2024"
artigo = "art. 18"

[[trilhos.res_conjunta_12.afirmacoes]]
tema = "trilho"
texto = "O bloqueio é simultâneo à formalização da operação de crédito."
categoria = "norma"
norma = "Res. Conjunta 12/2024"
artigo = "art. 8º"

[[trilhos.res_conjunta_12.afirmacoes]]
tema = "trilho"
texto = "O valor bloqueado não pode ser resgatado, portado nem transferido."
categoria = "norma"
norma = "Res. Conjunta 12/2024"
artigo = "art. 9º"

[[trilhos.res_conjunta_12.afirmacoes]]
tema = "trilho"
texto = "A troca de informações passa por plataforma de infraestrutura autorizada, exigida desde 30/09/2025."
categoria = "norma"
norma = "Res. Conjunta 12/2024"
artigo = "art. 10"

# ==================================================================== ativos
# instrumentos: o primeiro é o padrão. carteira_de_provisao: uma por instrumento.
# faixas_de_ltv: LTV de partida {1} (hipótese de calibração, anexo D3); `ate_anos` {ano}
# até o vencimento, crescente; a faixa sem `ate_anos` é a aberta (e a única, se não há
# prazo). liquidez_maxima_no_cartao_dias_uteis {dia_util}: 0 = D+0.
# dias_minimos_execucao {dia_corrido}: ausente = prazo contratual da política.

# --------------------------------------------------------------------- CDB
[ativos.cdb]
nome = "CDB de banco parceiro"
infraestrutura = "b3_balcao"
instrumentos = ["cessao_fiduciaria", "penhor"]
trilhos = ["casa", "transferencia_de_custodia"]
produtos = ["cartao", "emprestimo"]
condicao_no_cartao = "liquidez_diaria"
liquidez_maxima_no_cartao_dias_uteis = 0
recomendado = true
faixas_de_ltv = [{ minimo = "0.85", maximo = "0.95" }]

[ativos.cdb.carteira_de_provisao]
cessao_fiduciaria = "c2"
penhor = "c2"

[ativos.cdb.retencao]
regra = "tabela_regressiva_renda_fixa"

[[ativos.cdb.retencao.afirmacoes]]
tema = "retencao"
texto = "IR regressivo sobre o rendimento: 22,5% até 180 dias, 20% até 360, 17,5% até 720 e 15% acima. Quem paga o rendimento retém na fonte."
categoria = "norma"
norma = "Lei 11.033/2004"
artigo = "art. 1º"

[[ativos.cdb.afirmacoes]]
tema = "o_que_funciona"
texto = "Funciona hoje dentro de casa: CDB de banco parceiro custodiado na CTVM do grupo, com gravame registrado na B3 a favor da SCD do grupo."
categoria = "pratica_de_mercado"

[[ativos.cdb.afirmacoes]]
tema = "o_que_funciona"
texto = "Não há CDB da casa: a SCD não capta do público."
categoria = "norma"
norma = "Res. CMN 5.050/2022"
artigo = "art. 10, I"

[[ativos.cdb.afirmacoes]]
tema = "trilho"
texto = "Na casa, gravame no dia. De fora, só com o custodiante de origem ou transferindo a custódia antes, fora da Res. CVM 210."
categoria = "pratica_de_mercado"

[[ativos.cdb.afirmacoes]]
tema = "trilho"
texto = "Não encontramos norma que obrigue o custodiante a registrar gravame para credor de outra instituição."
categoria = "interpretacao"

[[ativos.cdb.afirmacoes]]
tema = "instrumento"
texto = "Cessão fiduciária: no atraso, o credor vende sem leilão nem ordem judicial, abate a dívida e devolve o saldo com demonstrativo."
categoria = "norma"
norma = "Lei 4.728/1965"
artigo = "art. 66-B, §§3º e 4º"

[[ativos.cdb.afirmacoes]]
tema = "instrumento"
texto = "Penhor de direitos e títulos: o bem continua do devedor e o credor tem preferência."
categoria = "norma"
norma = "Código Civil"
artigo = "arts. 1.451 a 1.460"

[[ativos.cdb.afirmacoes]]
tema = "instrumento"
texto = "Penhor de aplicações financeiras de tomador PJ ou MEI em recuperação judicial vai para conta vinculada; a forma fiduciária fica fora da recuperação."
categoria = "norma"
norma = "Lei 11.101/2005"
artigo = "art. 49, §§3º e 5º"

[[ativos.cdb.afirmacoes]]
tema = "infraestrutura"
texto = "O CDB é ativo financeiro registrado em registradora (B3, Balcão): a registradora registra o gravame; o custodiante comanda."
categoria = "norma"
norma = "Res. CMN 4.593/2017"
artigo = "art. 2º"

[[ativos.cdb.afirmacoes]]
tema = "infraestrutura"
texto = "O participante que é parte da operação registra o Instrumento de Constituição de Gravame; a contraparte confirma e, se recusar ou não responder, o ativo é liberado."
categoria = "norma"
norma = "Regulamento do Balcão B3 (21/09/2026) e Manual de Normas B3 (31/08/2026)"
artigo = "Regulamento art. 97, II; Manual arts. 88 e 94"

[[ativos.cdb.afirmacoes]]
tema = "produto"
texto = "Cartão só com liquidez diária; empréstimo nos demais casos."
categoria = "pratica_de_mercado"

[[ativos.cdb.afirmacoes]]
tema = "prazo"
texto = "Gravame no dia; transferência de custódia sem prazo legal encontrado."
categoria = "pratica_de_mercado"

[[ativos.cdb.afirmacoes]]
tema = "risco_de_execucao"
texto = "Médio: o resgate antecipado depende do emissor ou de mercado secundário; resta o risco do emissor."
categoria = "pratica_de_mercado"

[[ativos.cdb.afirmacoes]]
tema = "risco_de_execucao"
texto = "Se o emissor quebrar, o FGC paga ao titular registrado, não ao credor; o limite por emissor fica dentro do teto do FGC."
categoria = "norma"
norma = "Regulamento do FGC (Res. CMN 4.222/2013)"
artigo = "art. 2º, §4º, I"

[[ativos.cdb.afirmacoes]]
tema = "provisao"
texto = "Crédito garantido por depósito a prazo, CDB inclusive, vai para a C2, qualquer que seja o instrumento. Confirmar com a contabilidade."
categoria = "interpretacao"
norma = "Res. BCB 352/2023"
artigo = "art. 81, II, \"c\""

[[ativos.cdb.afirmacoes]]
tema = "ltv"
texto = "LTV de partida de 85% a 95%, dentro do teto do FGC por emissor: hipótese de calibração."
categoria = "interpretacao"

# ------------------------------------------------------------------ LCI e LCA
[ativos.lci]
nome = "LCI"
infraestrutura = "b3_balcao"
