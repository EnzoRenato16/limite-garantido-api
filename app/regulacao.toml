artigo = "arts. 8º e 16"

[[ativos.fii.afirmacoes]]
tema = "instrumento"
texto = "Alienação fiduciária de cotas: no atraso, o credor vende sem leilão nem ordem judicial, abate a dívida e devolve o saldo com demonstrativo."
categoria = "norma"
