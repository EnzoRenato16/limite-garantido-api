# Premissas do modelo econômico: esquema (faixas) e os três conjuntos prontos.
#
# Todos os números são ILUSTRATIVOS, salvo onde há `fonte` citada. Nada aqui é dado de
# empresa real. Quem quiser usar de verdade troca os valores pelos seus.
#
# Convenções de conversão (as mesmas do código):
#   - taxa ao ano vira taxa ao mês por juros compostos: (1 + a)^(1/12) - 1;
#   - frequência de eventos (vezes por ano) vira mensal dividindo por 12, sem composição;
#   - dias corridos viram mês por 365/12;
#   - taxa e fração são frações: 0.1365 = 13,65%. Dinheiro em reais, até 2 casas.
# Faixa aceita (`minimo`/`maximo`): o que a validação deixa passar, nas duas pontas.
# Faixa razoável (`razoavel`): os extremos do tornado; sem a chave, fica fora do tornado.
# Valores como texto, para não passar por float.

