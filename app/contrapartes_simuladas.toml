# Perfis das CONTRAPARTES SIMULADAS de cada trilho de entrada.
#
# Não são instituições: são personagens fictícios para mostrar o que acontece quando o
# ativo está em outra casa. Nada aqui integra com B3, Selic, corretora, banco ou
# seguradora. Todos os números são ilustrativos, escolhidos para a demonstração.
#
# O destino de cada pedido sai de um hash de (semente, id do pedido): mesma semente e
# mesmo pedido dão o mesmo resultado, em qualquer máquina.
#
# Cada perfil diz:
#   simulado            sempre true; o nome termina em "(simulador)";
#   trilhos             os trilhos de entrada que ele atende;
#   latencia_segundos   {segundo} depois do pedido em que a resposta fica pronta;
#   probabilidade_*     {1} razão entre 0 e 1; recusa + sem resposta não passa de 1.
#
# A entidade operadora não pode recusar pedido que siga as normas (Res. Conjunta 12,
# art. 18) e a corretora de origem só recusa por impedimento (Res. CVM 210, art. 19,
# §1º), que o sorteio não gera: os dois ficam com recusa zero.

[corretora_de_origem_simulada]
nome = "Corretora de origem (simulador)"
descricao = "Corretora onde estão ações, FIIs, ETFs e cotas de fundos do cliente. Conclui a portabilidade e nunca recusa por sorteio."
simulado = true
trilhos = ["portabilidade_cvm_210"]
semente = 31
latencia_segundos = 3600
probabilidade_de_recusa = "0"
probabilidade_sem_resposta = "0.05"
motivos_de_recusa = ["ativo_dado_em_garantia"]

