[project]
name = "limite-garantido-api"
version = "1.0.0"
description = "Limite Garantido as a Service: API de limite de crédito garantido por investimento (projeto de estudo)."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Enzo Renato" }]
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.4",
    "httpx2>=2.16.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "rich>=15.0.0",
    "sqlalchemy>=2",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "playwright>=1.65.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle e pyflakes
    "I",            # ordem dos imports
    "UP",           # sintaxe moderna
    "B",            # flake8-bugbear
    "C4",           # compreensões
    "SIM",          # simplificações
    "S",            # flake8-bandit (segurança)
    "DTZ",          # datetime sempre com fuso
    "PT",           # estilo pytest
    "RUF",
    "T20",          # nada de print esquecido
    "N",            # nomes
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # acentos e travessões são português, não erro de digitação
    "N818",                        # exceções de domínio não levam sufixo "Error"
    "A002", "A003",                # `id` é o nome natural do campo
    "B008",                        # Depends() em argumento padrão é o jeito do FastAPI
]

[tool.ruff.lint.isort]
# A pasta local `alembic/` (migrações) não é o pacote: o pacote é dependência externa.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "DTZ"]
# Frases de tela ficam mais legíveis inteiras do que quebradas em três pedaços.
"tests/e2e/**" = ["S101", "S105", "S106", "E501"]
"demo.py" = ["S101", "S105", "E501"]
"scripts/**" = ["T20"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
files = ["app"]

# O domínio é a parte que não pode errar: modo estrito completo.
[[tool.mypy.overrides]]
module = "app.dominio.*"
strict = true
disallow_any_explicit = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Os testes de navegador ficam fora do `pytest` comum; rode com `pytest -m e2e`.
addopts = "-ra --strict-markers -m 'not e2e'"
markers = [
    "postgres: precisa de um Postgres de verdade (DATABASE_URL_TESTE)",
    "e2e: abre navegador com Playwright",
]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
